<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Browser-based third-person wilderness exploration game">
  <title>WASTELAND // FIELD TEST</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="loading">INITIALIZING WORLD...</div>
  <div id="hud" hidden>
    <div class="hud-title">WASTELAND</div>
    <div id="status">WORLD ONLINE</div>
    <div id="clock">12:00</div>
    <div class="help">WASD / Arrow Keys: move　Z + W: run　Arrow Up/Down: camera pitch</div>
  </div>
  <div id="error" hidden></div>
  <script type="module" src="game.js"></script>
</body>
</html>
